spring.application.name=OnlineTestManagement
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/online_test}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=${PORT:8080}

app.jwt.secret=${JWT_SECRET:change-this-secret-to-a-random-256-bit-value-change-this-secret}
app.jwt.expiration=${JWT_EXPIRATION_MS:86400000}