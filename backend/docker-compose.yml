services:
  postgres:
    image: postgres:latest
    container_name: online-test-postgres
    environment:
      POSTGRES_DB: online_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - online-test-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d online_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  online-test-pgdata: